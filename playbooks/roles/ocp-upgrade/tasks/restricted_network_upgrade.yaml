---

# tasks for updating a restricted network ocp cluster

- name: Get count of paused machine config pools
  shell: |
    oc get mcp -ojson | jq ".items[].spec.paused" | grep -i true | wc -l
  register: paused_mcps_count

- name: Warn if machine config pools are paused
  debug:
    msg: "One or more Machine config pools appears paused. Nodes associated with a paused MCP are skipped during the update process."
  when: 0 < paused_mcps_count.stdout|int

- name: Build OCP upgrade image reference from IDMS
  set_fact:
    ocp_upgrade_image_ref: "quay.io/openshift-release-dev/ocp-release@sha256:{{ upgrade_image_sha_key.stdout | trim}}"

- name: set image workspace directory
  set_fact:
    repo_image_dir: "{{ oc_mirror_workspace_dir }}"

- name: Set release image repository path (oc-mirror v2 convention)
  set_fact:
    release_image_repository: "{{ local_repository }}/openshift/release-images"

- name: Create repo image workspace directory
  file:
    path: "{{ repo_image_dir }}"
    state: directory
    mode: '0755'

- name: Generate ImageSetConfiguration for upgrade
  template:
    src: "{{ role_path }}/templates/upgrade-imageset-config.yaml.j2"
    dest: "{{ repo_image_dir }}/upgrade-imageset-config.yaml"
    mode: '0644'

- name: Mirror release images to local directory using oc-mirror --v2 (disk to file)
  shell: |
    oc-mirror \
      -c {{ repo_image_dir }}/upgrade-imageset-config.yaml \
      file://{{ repo_image_dir }}/mirror \
      --authfile {{ local_secret }} \
      --v2
  register: oc_mirror_to_file

- name: Upload mirrored images from local directory to registry using oc-mirror --v2 (file to mirror)
  shell: |
    oc-mirror \
      -c {{ repo_image_dir }}/upgrade-imageset-config.yaml \
      --from file://{{ repo_image_dir }}/mirror \
      docker://{{ local_registry }}/{{ local_repository }} \
      --authfile {{ local_secret }} \
      --v2
  register: oc_mirror_to_registry

- name: Apply IDMS and ITMS cluster-resources from oc-mirror working directory
  shell: |
    oc apply -f {{ repo_image_dir }}/mirror/working-dir/cluster-resources/idms-oc-mirror.yaml \
             -f {{ repo_image_dir }}/mirror/working-dir/cluster-resources/itms-oc-mirror.yaml
  register: idms_itms_apply
  changed_when: idms_itms_apply.rc == 0

- name: Apply signature configmap from oc-mirror working directory
  shell: |
    oc apply -f {{ repo_image_dir }}/mirror/working-dir/cluster-resources/signature-configmap.yaml
  ignore_errors: true

- name: Get sha key of the upgrade image from local registry
  shell: |
    oc image info --registry-config {{ local_secret }} \
      {{ local_registry }}/{{ release_image_repository }}:{{ upgrade_version }}-{{ architecture }} \
      | grep "Digest:" | awk '{print $2}' | cut -d ':' -f 2
  register: upgrade_image_sha_key

- name: Fail if SHA digest could not be resolved
  fail:
    msg: >
      Could not resolve SHA digest for {{ upgrade_version }}-{{ architecture }} from
      {{ local_registry }}/{{ release_image_repository }}.
      Verify with: oc image info --registry-config {{ local_secret }}
      {{ local_registry }}/{{ release_image_repository }}:{{ upgrade_version }}-{{ architecture }}
  when: upgrade_image_sha_key.stdout | trim == ""

- name: Get the OCP version 
  kubernetes.core.k8s_info:
    kind: ClusterVersion
    name: version
  register: ocp_version

- name: Providing the administrator acknowledgement for 4.8 to 4.9 upgrades
  kubernetes.core.k8s:
    state: present
    definition:
      kind: ConfigMap
      metadata:
        name: admin-acks
        namespace: openshift-config
      data:
        ack-4.8-kube-1.22-api-removals-in-4.9: "true"
  when: ocp_version.resources[0].status.history[0].version | regex_search('4.8') == "4.8"

- name: Providing the administrator acknowledgement for 4.13 to 4.14 upgrades
  kubernetes.core.k8s:
    state: present
    definition:
      kind: ConfigMap
      metadata:
        name: admin-acks
        namespace: openshift-config
      data:
        ack-4.13-kube-1.27-api-removals-in-4.14: "true"
  when: ocp_version.resources[0].status.history[0].version | regex_search('4.13') == "4.13"

- name: Upgrade ocp and check for its completion
  block:
  - name: Upgrade ocp using a source release reference (resolved via IDMS)
    shell: |
        oc adm upgrade --allow-explicit-upgrade \
        --to-image={{ ocp_upgrade_image_ref }}
    register: ocp_upgrade_result
    changed_when: "'no updates are available' not in ocp_upgrade_result.stdout"
  
  - name: Waiting until upgrade completes
    pause:
      minutes: "{{ pause_time }}"

  - name: Check for upgrade completion
    shell: |
      oc get clusterversion -o json|jq ".items[0].status.history[0].state"
    register: state
    until: state.stdout | replace('\"', '') == "Completed"
    retries: 5
    delay: "{{ delay_time }}"

